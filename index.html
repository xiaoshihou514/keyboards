<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="K500、Q11 与 Sofle 三把机械键盘的三维预览。" />
  <title>键盘档案</title>
  <link rel="stylesheet" href="./styles/landing.css?v=3" />
</head>
<body data-page="landing">
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="返回页面顶部">键盘档案</a>
    <p>03</p>
  </header>

  <main id="top">
    <section class="collection" aria-label="键盘收藏">
      <article class="keyboard-card" aria-labelledby="keyboard-01-title">
        <div class="preview-shell">
          <iframe class="preview-frame" src="./k500.html?embed=1" title="一号 K500 键盘三维预览" loading="eager" allow="fullscreen" allowfullscreen></iframe>
        </div>
        <div class="card-details">
          <h2 id="keyboard-01-title">K500</h2>
          <a class="fullscreen-link" href="./k500.html" data-fullscreen aria-label="全屏查看 K500 键盘">全屏 <span aria-hidden="true">↗</span></a>
        </div>
      </article>

      <article class="keyboard-card" aria-labelledby="keyboard-02-title">
        <div class="preview-shell">
          <iframe class="preview-frame" src="./q11.html?embed=1" title="二号 Q11 分体键盘三维预览" loading="eager" allow="fullscreen" allowfullscreen></iframe>
        </div>
        <div class="card-details">
          <h2 id="keyboard-02-title">Q11</h2>
          <a class="fullscreen-link" href="./q11.html" data-fullscreen aria-label="全屏查看 Q11 键盘">全屏 <span aria-hidden="true">↗</span></a>
        </div>
      </article>

      <article class="keyboard-card" aria-labelledby="keyboard-03-title">
        <div class="preview-shell">
          <iframe class="preview-frame" src="./demo.html?embed=1&amp;layer=0&amp;rgb=0" title="三号 Sofle 键盘三维预览" loading="eager" allow="fullscreen" allowfullscreen></iframe>
        </div>
        <div class="card-details">
          <h2 id="keyboard-03-title">Sofle</h2>
          <a class="fullscreen-link" href="./demo.html?layer=0&amp;rgb=0" data-fullscreen aria-label="全屏查看 Sofle矮轴58% 键盘">全屏 <span aria-hidden="true">↗</span></a>
        </div>
      </article>

    </section>
  </main>

  <script type="module" src="./.scala-output.js"></script>
</body>
</html>
