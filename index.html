<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split Keyboard · three.js</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07070b; }
    canvas { display: block; }
    #hud {
      position: fixed; top: 18px; left: 22px; color: #cfc6e8;
      font-family: "Segoe UI", system-ui, sans-serif; user-select: none;
      pointer-events: none;
    }
    #hud h1 {
      margin: 0 0 2px; font-size: 17px; font-weight: 600; letter-spacing: 0.14em;
      color: #e6dcf9; text-shadow: 0 0 14px rgba(168, 85, 247, 0.55);
    }
    #hud p { margin: 0 0 12px; font-size: 11px; opacity: 0.55; letter-spacing: 0.06em; }
    .row { display: flex; gap: 8px; pointer-events: auto; margin-bottom: 8px; }
    button {
      background: rgba(30, 22, 52, 0.55); color: #b9a8e8;
      border: 1px solid rgba(168, 85, 247, 0.35); border-radius: 8px;
      font: 600 11px/1 "Segoe UI", system-ui, sans-serif;
      padding: 7px 12px; cursor: pointer; letter-spacing: 0.08em;
      backdrop-filter: blur(6px); transition: all 0.15s;
    }
    button:hover { border-color: #a855f7; color: #e9d5ff; }
    button.on { background: rgba(126, 34, 206, 0.45); color: #f3e8ff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.45); }
    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #6f6392; font: 11px/1.5 "Segoe UI", system-ui, sans-serif;
      letter-spacing: 0.08em; user-select: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>SPLIT · 58</h1>
    <p>procedural replica of my handwired split keyboard</p>
    <div class="row" id="layers">
      <button class="on">LAYER 0</button>
      <button>LAYER 1</button>
      <button>LAYER 2</button>
    </div>
    <div class="row">
      <button id="rgb">RGB: wave</button>
      <button id="spin">ROTATE</button>
      <button id="demo">DEMO TYPE</button>
    </div>
  </div>
  <div id="hint">drag to orbit · scroll to zoom · click keys · type on your real keyboard</div>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
